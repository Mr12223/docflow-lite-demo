[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "reports", "uploads_temp", "tmp"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "reports", "uploads_temp", "tmp", "发票样本/InvoiceDatasets-master"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

